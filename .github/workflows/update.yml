name: Collect and publish clubs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * 0' # Sunday 22:17 UTC = Monday 07:17 KST
  push:
    branches: [main]
    paths-ignore: ['data/**', 'site/data.json']
  issues:
    types: [labeled, unlabeled, edited, closed, reopened]
permissions: {}
concurrency:
  group: clubs-publish
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write # Creates the approved label on first installation.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Test frontend
        run: node --test tests/test_frontend.js
      - name: Collect approved public activities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py
      - name: Save collection history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh club activities'
            git push
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
