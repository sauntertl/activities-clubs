name: Collect and publish clubs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * 0' # Sunday 22:17 UTC = Monday 07:17 KST
  push:
    branches: [main]
    paths-ignore: ['data/**', 'site/data.json']
  issues:
    types: [labeled, unlabeled, edited, closed, reopened]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: clubs-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect approved public activities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py
      - name: Save collection history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh club activities'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
